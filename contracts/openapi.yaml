openapi: 3.1.0
info:
  title: Configuration System MVP API
  version: 1.0.0
  description: 批次 0 的 catalog、图片解析和静态渲染契约。发布图片遵循 bake manifest 的 P0-3 path-tracing 与 straight Alpha 处理约束。
servers:
  - url: /
paths:
  /health:
    get:
      operationId: getHealth
      summary: 健康检查
      responses:
        "200":
          description: 服务和已发布数据可用
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, catalogVersion, publicationVersion]
                properties:
                  status:
                    const: ok
                  catalogVersion:
                    type: string
                  publicationVersion:
                    type: string
  /api/v1/catalog:
    get:
      operationId: getCatalog
      summary: 获取当前选配目录
      responses:
        "200":
          description: 当前目录
          content:
            application/json:
              schema:
                $ref: ./schemas/catalog.schema.json
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/renders/resolve:
    post:
      operationId: resolveRender
      summary: 将合法配置和视角解析为渲染图片 URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRenderRequest"
      responses:
        "200":
          description: 图片解析成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveRenderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
  /assets/renders/{publicationVersion}/{vehicleId}/{configurationKey}/{renderViewId}.png:
    get:
      operationId: getRender
      summary: 获取已发布的 straight Alpha 透明 PNG
      description: 图片由 path-tracing 烘焙并按 manifest 的 alphaProcessing 策略归一化；ready render 会记录 coverage 反转、归一化和发光像素恢复结果。
      parameters:
        - $ref: "#/components/parameters/PublicationVersion"
        - $ref: "#/components/parameters/VehicleId"
        - $ref: "#/components/parameters/ConfigurationKey"
        - $ref: "#/components/parameters/RenderViewId"
      responses:
        "200":
          description: 已完成 P0-3 Alpha 处理的 sRGB RGBA PNG（straight Alpha）
          headers:
            Cache-Control:
              schema:
                type: string
              description: 不可变版本资源应使用长期缓存。
          content:
            image/png:
              schema:
                type: string
                contentEncoding: binary
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    PublicationVersion:
      name: publicationVersion
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    ConfigurationKey:
      name: configurationKey
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ConfigurationKey"
    RenderViewId:
      name: renderViewId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RenderViewId"
  schemas:
    StableId:
      type: string
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    ConfigurationKey:
      type: string
      pattern: ^paint-[a-z0-9-]+__wheel-[a-z0-9-]+__interior-[a-z0-9-]+__frame-[a-z0-9-]+$
    RenderViewId:
      type: string
      enum: [front, front-left, side, rear-right]
    Selections:
      type: object
      additionalProperties: false
      required: [paint, wheel, interior, frame]
      properties:
        paint:
          $ref: "#/components/schemas/StableId"
        wheel:
          $ref: "#/components/schemas/StableId"
        interior:
          $ref: "#/components/schemas/StableId"
        frame:
          $ref: "#/components/schemas/StableId"
    ResolveRenderRequest:
      type: object
      additionalProperties: false
      required:
        [catalogVersion, publicationVersion, vehicleId, selections, renderViewId]
      properties:
        catalogVersion:
          $ref: "#/components/schemas/StableId"
        publicationVersion:
          $ref: "#/components/schemas/StableId"
        vehicleId:
          $ref: "#/components/schemas/StableId"
        selections:
          $ref: "#/components/schemas/Selections"
        renderViewId:
          $ref: "#/components/schemas/RenderViewId"
    ResolveRenderResponse:
      type: object
      additionalProperties: false
      required:
        [configurationKey, renderViewId, imageUrl]
      properties:
        configurationKey:
          $ref: "#/components/schemas/ConfigurationKey"
        renderViewId:
          $ref: "#/components/schemas/RenderViewId"
        imageUrl:
          type: string
          pattern: ^/assets/renders/
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
  responses:
    BadRequest:
      description: 请求 JSON、ID、配置或视角非法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: manifest 中不存在对应图片，或对应 render 尚未达到 ready 状态
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    VersionConflict:
      description: 客户端版本与当前发布版本冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: catalog 或满足 P0-3 renderer、alphaProcessing 与 ready render 元数据要求的 manifest 尚未就绪
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
